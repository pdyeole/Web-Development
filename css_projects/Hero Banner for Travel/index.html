<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Hero Banner</title>

  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  

  <!-- Link CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Hero Section Container -->
  <header class="hero-banner">
    <div class="hero-content">
      <span class="hero-subtitle">DISCOVER THE UNKNOWN</span>
      <h1 class="hero-title">Adventure Awaits Beyond the Horizon</h1>
      <p class="hero-description">
        Explore breathtaking landscapes, hidden mountain trails, and vibrant cultures. 
        Start planning your next unforgettable journey today.
      </p>

      <!-- Action Buttons -->
      <div class="button-group">
        <a href="#" class="btn btn-primary">Explore Destinations</a>
        <a href="#" class="btn btn-secondary">Watch Story</a>
      </div>
    </div>
  </header>

</body>
</html>
