<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="counter-card">
       <h1 class="title">Counter Game</h1>
       <div class="count-display" id="count">0</div>
       <div class="btn-grp">
            <button class="btn btn-increment" aria-label="Increment Count">+</button>
            <button class="btn btn-decrement" aria-label="Decrement Count">-</button>
       </div>

       <div id="notify"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>
