<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reel Card</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>
    <main>
        <div class="card">
            <img src="./media/girl_photo.png" id="card-img" alt="Photo">
            
    
            <i class="ri-heart-fill heart" id="love"></i>
            
            
            <i class="ri-play-fill media-icon" id="media-status"></i>
            
            <h2>Miss Senorita</h2>
            
            
            <audio id="gani-song" src="./media/song.mp3"></audio>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
